# Configuration for actionlint, run by the "Validate GitHub Actions workflows"
# step in pr-build.yml. See https://github.com/rhysd/actionlint/blob/main/docs/config.md
self-hosted-runner:
  # actionlint only knows the GitHub-hosted runner labels, so every custom
  # runner label used in a `runs-on:` must be declared here or it fails the
  # [runner-label] check. Keep this list in sync with the labels registered
  # for the org's runner groups.
  labels:
    - apm-canary-4-core
