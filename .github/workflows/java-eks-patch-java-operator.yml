# One-time patch of the shared cluster-wide CloudWatch Observability operator's
# --auto-instrumentation-java-image to the ADOT image under test. Runs ONCE (needs: eks-setup)
# before the parallel eks-v* / service-events-eks jobs, so those jobs never patch or roll out the
# singleton operator themselves. This removes the operator-Deployment contention (rollout races,
# webhook churn) that serialized the "parallel" Java EKS jobs and pushed them past the run time cap.
#
# Java-scoped by design: it only touches --auto-instrumentation-java-image. Other languages patch
# their own --auto-instrumentation-<lang>-image arg independently, so this does not affect them, and
# it does NOT modify the shared eks-setup-app-signals.yml.
name: Java EKS Patch Operator Image

on:
  workflow_call:
    inputs:
      test-cluster-name:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: 'us-east-1'
      adot-image-name:
        description: "ADOT Java auto-instrumentation image to set on the shared operator."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  E2E_TEST_AWS_REGION: ${{ inputs.aws-region }}
  CLUSTER_NAME: ${{ inputs.test-cluster-name }}
  PATCH_IMAGE_ARN: ${{ inputs.adot-image-name }}
  E2E_TEST_ACCOUNT_ID: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}
  E2E_TEST_ROLE_NAME: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}

jobs:
  patch-java-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate input
        run: |
          if [ -z "${{ env.PATCH_IMAGE_ARN }}" ]; then
            echo "::error::adot-image-name input is empty; nothing to patch."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.E2E_TEST_ACCOUNT_ID }}:role/${{ env.E2E_TEST_ROLE_NAME }}
          aws-region: us-east-1

      - name: Set up kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.E2E_TEST_AWS_REGION }}

      - name: Patch operator java image and wait for rollout
        run: |
          # Idempotent: skip the write (and rollout) if the operator already targets our image, so a
          # re-run does not restart the operator needlessly.
          patched=0
          for patch_attempt in 1 2 3 4 5 6; do
            CURRENT_JAVA_IMAGE=$(kubectl get deploy -n amazon-cloudwatch amazon-cloudwatch-observability-controller-manager \
              -o jsonpath='{range .spec.template.spec.containers[0].args[*]}{.}{"\n"}{end}' \
              | sed -n 's/^--auto-instrumentation-java-image=//p')
            if [ "$CURRENT_JAVA_IMAGE" = "${{ env.PATCH_IMAGE_ARN }}" ]; then
              echo "Operator java image is set to target (${{ env.PATCH_IMAGE_ARN }})."
              patched=1
              break
            fi
            echo "Attempt $patch_attempt: patching operator java image '$CURRENT_JAVA_IMAGE' -> '${{ env.PATCH_IMAGE_ARN }}'"
            if kubectl get deploy -n amazon-cloudwatch amazon-cloudwatch-observability-controller-manager -o json \
                | jq '.spec.template.spec.containers[0].args |= map(if test("^--auto-instrumentation-java-image=") then "--auto-instrumentation-java-image=${{ env.PATCH_IMAGE_ARN }}" else . end)' \
                | kubectl apply -f - ; then
              echo "Patch applied on attempt $patch_attempt."
              patched=1
              break
            fi
            echo "Patch attempt $patch_attempt failed; re-reading and retrying..."
            sleep 10
          done
          if [ "$patched" -ne 1 ]; then
            echo "::error::Failed to set operator java image after retries."
            exit 1
          fi

          kubectl -n amazon-cloudwatch rollout status \
            deployment/amazon-cloudwatch-observability-controller-manager --timeout=300s
