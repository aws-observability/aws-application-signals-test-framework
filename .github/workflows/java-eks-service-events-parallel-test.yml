# Parallel variant of the Java EKS Service Events E2E test.
# Unlike java-eks-service-events-test.yml (which self-installs App Signals per run), this assumes
# Application Signals is already installed cluster-wide by eks-setup-app-signals.yml, so it can run
# concurrently with the eks-v* version jobs on the shared cluster. It patches the shared operator's
# --auto-instrumentation-java-image to the ADOT image under test (idempotent), restarts its own
# sample app, verifies injection, then runs the Service Events validations. Teardown of App Signals
# itself is handled once by eks-cleanup-app-signals.yml after all parallel jobs finish.
name: Java EKS Service Events Use Case (Parallel)
on:
  workflow_call:
    inputs:
      aws-region:
        required: false
        type: string
        default: 'us-east-1'
      test-cluster-name:
        required: true
        type: string
      caller-workflow-name:
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: '11'
      adot-image-name:
        required: false
        type: string
    outputs:
      job-started:
        value: ${{ jobs.java-eks-service-events.outputs.job-started }}
      validation-result:
        value: ${{ jobs.java-eks-service-events.outputs.validation-result }}

permissions:
  id-token: write
  contents: read

env:
  E2E_TEST_AWS_REGION: ${{ inputs.aws-region || 'us-east-1' }}
  CALLER_WORKFLOW_NAME: ${{ inputs.caller-workflow-name || 'manual-dispatch' }}
  E2E_TEST_ACCOUNT_ID: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}
  E2E_TEST_ROLE_NAME: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}
  TEST_RESOURCES_FOLDER: ${GITHUB_WORKSPACE}
  CLUSTER_NAME: ${{ inputs.test-cluster-name || 'e2e-adot-test' }}
  JAVA_VERSION: ${{ inputs.java-version || '11' }}
  ADOT_IMAGE_NAME: ${{ inputs.adot-image-name }}
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  LOG_GROUP_NAME: /aws/application-signals/data

jobs:
  java-eks-service-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      job-started: ${{ steps.job-started.outputs.job-started }}
      validation-result: ${{ steps.validation-result.outputs.validation-result }}
    steps:
      - name: Check if the job started
        id: job-started
        run: echo "job-started=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: 'aws-observability/aws-application-signals-test-framework'
          # TESTING PIN: pull terraform/java/eks/service-events (distinct NodePort) + this workflow
          # from the feature branch, since they are not yet on main. REVERT to 'main' before merging.
          ref: ${{ env.CALLER_WORKFLOW_NAME == 'main-build' && 'java-eks-test-fix' || github.ref }}
          fetch-depth: 0

      - name: Initiate Gradlew Daemon
        id: initiate-gradlew
        uses: ./.github/workflows/actions/execute_and_retry
        continue-on-error: true
        with:
          command: "./gradlew :validator:build"
          cleanup: "./gradlew clean"
          max_retry: 3
          sleep_time: 60

      - name: Generate testing id
        run: echo TESTING_ID="${{ github.run_id }}-${{ github.run_number }}-${RANDOM}" >> "$GITHUB_ENV"

      - name: Set Service Name
        run: echo SERVICE_NAME="java-sample-application-${{ env.TESTING_ID }}" >> "$GITHUB_ENV"

      # Distinct 'se' prefix so this namespace never collides with the version jobs' ns-jv* namespaces
      # while they run concurrently on the shared cluster.
      - name: Set Namespace
        run: echo SAMPLE_APP_NAMESPACE="ns-se-${{ github.run_id }}-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.E2E_TEST_ACCOUNT_ID }}:role/${{ env.E2E_TEST_ROLE_NAME }}
          aws-region: us-east-1

      - name: Retrieve account
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ACCOUNT_ID, region-account/${{ env.E2E_TEST_AWS_REGION }}
            JAVA_MAIN_SAMPLE_APP_IMAGE, e2e-test/java-main-sample-app-image

      - name: Set Sample App Image
        run: echo MAIN_SAMPLE_APP_IMAGE_ARN="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.E2E_TEST_AWS_REGION }}.amazonaws.com/${{ env.JAVA_MAIN_SAMPLE_APP_IMAGE }}:v${{ env.JAVA_VERSION }}" >> "$GITHUB_ENV"

      # local directory to store the kubernetes config
      - name: Create kubeconfig directory
        run: mkdir -p ${{ github.workspace }}/.kube

      - name: Set KUBECONFIG environment variable
        run: echo KUBECONFIG="${{ github.workspace }}/.kube/config" >> "$GITHUB_ENV"

      - name: Set up kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.E2E_TEST_AWS_REGION }}

      - name: Download and install eksctl
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          pre-command: 'mkdir ${{ github.workspace }}/eksctl'
          command: 'curl -sLO "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
            && tar -xzf eksctl_Linux_amd64.tar.gz -C ${{ github.workspace }}/eksctl && rm eksctl_Linux_amd64.tar.gz'
          cleanup: 'rm -f eksctl_Linux_amd64.tar.gz'

      - name: Add eksctl to Github Path
        run: echo "${{ github.workspace }}/eksctl" >> "$GITHUB_PATH"

      # Delete only THIS run's namespace if it lingers. Do NOT bulk-delete all ns-* namespaces:
      # the concurrent eks-v* jobs own their own namespaces and a bulk delete would tear down a live test.
      - name: Delete this run's sample app namespace if it lingers
        continue-on-error: true
        timeout-minutes: 5
        run: kubectl delete namespace "${{ env.SAMPLE_APP_NAMESPACE }}" --ignore-not-found

      - name: Create role for AWS access from the sample app
        id: create_service_account
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: "eksctl create iamserviceaccount \
          --name service-account-${{ env.TESTING_ID }} \
          --namespace ${{ env.SAMPLE_APP_NAMESPACE }} \
          --cluster ${{ env.CLUSTER_NAME }} \
          --role-name eks-s3-access-${{ env.TESTING_ID }} \
          --attach-policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess \
          --region ${{ env.E2E_TEST_AWS_REGION }} \
          --approve"
          cleanup: "eksctl delete iamserviceaccount \
          --name service-account-${{ env.TESTING_ID }} \
          --namespace ${{ env.SAMPLE_APP_NAMESPACE }} \
          --cluster ${{ env.CLUSTER_NAME }} \
          --region ${{ env.E2E_TEST_AWS_REGION }}"
          sleep_time: 60

      - name: Set up terraform
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: "wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg"
          post-command: 'echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
              && sudo apt update && sudo apt install terraform'
          sleep_time: 60

      - name: Initiate Terraform
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: "cd ${{ env.TEST_RESOURCES_FOLDER }}/terraform/java/eks/service-events && terraform init && terraform validate"
          cleanup: "rm -rf .terraform && rm -rf .terraform.lock.hcl"
          max_retry: 6
          sleep_time: 60

      # The ADOT image this test injects. Set BEFORE deploy so the operator patch below can reference
      # it. All parallel jobs pass the SAME image, so patching the shared operator is idempotent.
      - name: Determine ADOT image to inject
        run: |
          if [ -z "${{ env.ADOT_IMAGE_NAME }}" ]; then
            echo "::error::adot-image-name input is empty; nothing to inject."
            exit 1
          fi
          echo PATCH_IMAGE_ARN="${{ env.ADOT_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Deploy sample app via terraform and wait for injection
        id: deploy-java-app
        working-directory: terraform/java/eks/service-events
        run: |
          # Deploy the sample app, then (App Signals already installed cluster-wide by
          # eks-setup-app-signals.yml) verify the shared install is healthy, point the shared operator
          # at the ADOT image under test, and restart the sample app so it is injected. Retry up to 2x.
          retry_counter=0
          max_retry=2
          while [ $retry_counter -lt $max_retry ]; do
            echo "Attempt $retry_counter"
            deployment_failed=0
            terraform apply -auto-approve \
              -var="aws_region=${{ env.E2E_TEST_AWS_REGION }}" \
              -var="main_node_port=30110" \
              -var="test_id=${{ env.TESTING_ID }}" \
              -var="eks_cluster_name=${{ env.CLUSTER_NAME }}" \
              -var="eks_cluster_context_name=$(kubectl config current-context)" \
              -var="test_namespace=${{ env.SAMPLE_APP_NAMESPACE }}" \
              -var="service_account_aws_access=service-account-${{ env.TESTING_ID }}" \
              -var="java_app_image=${{ env.MAIN_SAMPLE_APP_IMAGE_ARN }}" \
              -var="account_id=${{ env.ACCOUNT_ID }}" \
              -var="kube_directory_path=${{ github.workspace }}/.kube" \
              -var="service_events_git_commit_sha=${{ github.sha }}" \
            || deployment_failed=$?

            if [ $deployment_failed -eq 1 ]; then
              echo "Terraform deployment was unsuccessful. Will attempt to retry deployment."
            fi

            if [ $deployment_failed -eq 0 ]; then
              echo "Verifying Application Signals is enabled on the cluster"
              . ${{ env.TEST_RESOURCES_FOLDER }}/.github/workflows/util/execute_and_retry.sh

              aws eks update-kubeconfig --region ${{ env.E2E_TEST_AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

              execute_and_retry 30 \
                "[ \"\$(aws eks describe-addon --cluster-name ${{ env.CLUSTER_NAME }} --addon-name amazon-cloudwatch-observability --region ${{ env.E2E_TEST_AWS_REGION }} --query 'addon.status' --output text)\" = ACTIVE ]" \
                "" 20

              agent_pods=$(kubectl get pods -n amazon-cloudwatch -l app.kubernetes.io/name=cloudwatch-agent \
                -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.spec.containers[0].env[?(@.name=="AWS_ROLE_ARN")].value}{"\n"}{end}' 2>/dev/null) || {
                  echo "::error::Could not query cloudwatch-agent pods in amazon-cloudwatch namespace."
                  exit 1
                }
              agent_pods=$(printf '%s\n' "$agent_pods" | grep -v '^[[:space:]]*$' || true)
              agent_total=$(printf '%s\n' "$agent_pods" | grep -c . || true)
              if [ "${agent_total:-0}" -eq 0 ]; then
                echo "::error::No cloudwatch-agent pods found. Shared setup (eks-setup-app-signals.yml)"
                echo "should have installed the amazon-cloudwatch-observability addon before this job ran."
                exit 1
              fi
              agent_missing_irsa=$(printf '%s\n' "$agent_pods" | awk -F'|' '$2==""{print $1}')
              if [ -n "$agent_missing_irsa" ]; then
                echo "::error::cloudwatch-agent pods lack projected IRSA credentials: $agent_missing_irsa"
                echo "Shared setup (eks-setup-app-signals.yml) should have established this."
                exit 1
              fi
              echo "cloudwatch-agent has IRSA credentials projected ($agent_total pod(s))."

              patched=0
              for patch_attempt in 1 2 3 4 5 6; do
                CURRENT_JAVA_IMAGE=$(kubectl get deploy -n amazon-cloudwatch amazon-cloudwatch-observability-controller-manager \
                  -o jsonpath='{range .spec.template.spec.containers[0].args[*]}{.}{"\n"}{end}' \
                  | sed -n 's/^--auto-instrumentation-java-image=//p')
                if [ "$CURRENT_JAVA_IMAGE" = "${{ env.PATCH_IMAGE_ARN }}" ]; then
                  echo "Operator java image is set to target (${{ env.PATCH_IMAGE_ARN }})."
                  patched=1
                  break
                fi
                echo "Attempt $patch_attempt: patching operator java image '$CURRENT_JAVA_IMAGE' -> '${{ env.PATCH_IMAGE_ARN }}'"
                if kubectl get deploy -n amazon-cloudwatch amazon-cloudwatch-observability-controller-manager -o json \
                    | jq '.spec.template.spec.containers[0].args |= map(if test("^--auto-instrumentation-java-image=") then "--auto-instrumentation-java-image=${{ env.PATCH_IMAGE_ARN }}" else . end)' \
                    | kubectl apply -f - ; then
                  echo "Patch applied on attempt $patch_attempt."
                  patched=1
                  break
                fi
                echo "Patch attempt $patch_attempt lost a concurrent write; re-reading and retrying..."
                sleep 10
              done
              if [ "$patched" -ne 1 ]; then
                echo "Failed to set operator java image after retries."
                exit 1
              fi

              kubectl -n amazon-cloudwatch rollout status \
                deployment/amazon-cloudwatch-observability-controller-manager --timeout=180s \
                || echo "Operator rollout wait timed out; continuing (injection is verified below)."

              inject_verified=0
              for inject_attempt in 1 2 3 4 5; do
                execute_and_retry 2 "kubectl delete pods --all -n ${{ env.SAMPLE_APP_NAMESPACE }}" "" 60
                execute_and_retry 2 "kubectl wait --for=condition=Ready --request-timeout '5m' pod --all -n ${{ env.SAMPLE_APP_NAMESPACE }}" "" 10
                INJECTED_IMAGE=$(kubectl get pod -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=java-app \
                  -o jsonpath='{.items[0].spec.initContainers[?(@.name=="opentelemetry-auto-instrumentation-java")].image}' 2>/dev/null || true)
                if [ "$INJECTED_IMAGE" = "${{ env.PATCH_IMAGE_ARN }}" ]; then
                  echo "Instrumentation injected with target image on attempt $inject_attempt: $INJECTED_IMAGE"
                  inject_verified=1
                  break
                fi
                echo "Instrumentation not yet injected with target image on attempt $inject_attempt (got: '${INJECTED_IMAGE:-none}', want: '${{ env.PATCH_IMAGE_ARN }}'); retrying restart..."
                sleep 20
              done
              if [ "$inject_verified" -ne 1 ]; then
                echo "Instrumentation was never injected with the target image after retries; failing so this is not a silent empty-telemetry pass."
                exit 1
              fi
            fi

            if [ $deployment_failed -eq 1 ]; then
              echo "Destroying terraform"
              terraform destroy -auto-approve \
                -var="aws_region=${{ env.E2E_TEST_AWS_REGION }}" \
                -var="main_node_port=30110" \
                -var="test_id=${{ env.TESTING_ID }}" \
                -var="eks_cluster_name=${{ env.CLUSTER_NAME }}" \
                -var="eks_cluster_context_name=$(kubectl config current-context)" \
                -var="test_namespace=${{ env.SAMPLE_APP_NAMESPACE }}" \
                -var="service_account_aws_access=service-account-${{ env.TESTING_ID }}" \
                -var="java_app_image=${{ env.MAIN_SAMPLE_APP_IMAGE_ARN }}" \
                -var="account_id=${{ env.ACCOUNT_ID }}" \
                -var="kube_directory_path=${{ github.workspace }}/.kube"
              retry_counter=$(($retry_counter+1))
            else
              break
            fi

            if [ $retry_counter -ge $max_retry ]; then
              echo "Max retry reached. Exiting."
              exit 1
            fi
          done

      - name: Get app endpoint and configure traffic generator
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: echo "APP_ENDPOINT=$(kubectl get pods -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=java-app -o jsonpath='{.items[0].status.podIP}'):8080" >> "$GITHUB_ENV"
          max_retry: 3
          sleep_time: 10

      # The generic traffic-generator image blocks until MAIN_ENDPOINT, REMOTE_ENDPOINT, and ID
      # are all set. Service Events has no remote service, so point REMOTE_ENDPOINT at the app itself.
      - name: Set traffic generator endpoints
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: kubectl set env -n ${{ env.SAMPLE_APP_NAMESPACE }} deployment/traffic-generator MAIN_ENDPOINT=${{ env.APP_ENDPOINT }} REMOTE_ENDPOINT=${{ env.APP_ENDPOINT }}
          max_retry: 3
          sleep_time: 10

      - name: Wait for signals to propagate
        run: sleep 60

      - name: Initiate Gradlew Daemon
        if: steps.initiate-gradlew.outcome == 'failure'
        uses: ./.github/workflows/actions/execute_and_retry
        continue-on-error: true
        with:
          command: "./gradlew :validator:build"
          cleanup: "./gradlew clean"
          max_retry: 3
          sleep_time: 60

      # ---- Service Events log signals ----

      - name: Validate DeploymentEvent log
        id: deployment-event-validation
        run: ./gradlew validator:run --args='-c java/eks/service-events/deployment-event-validation.yml
          --testing-id ${{ env.TESTING_ID }}
          --endpoint http://${{ env.APP_ENDPOINT }}
          --region ${{ env.E2E_TEST_AWS_REGION }}
          --log-group /aws/service-events/${{ env.SERVICE_NAME }}
          --service-name ${{ env.SERVICE_NAME }}
          --rollup'

      - name: Validate IncidentSnapshot log
        id: incident-snapshot-validation
        if: (success() || steps.deployment-event-validation.outcome == 'failure') && !cancelled()
        run: ./gradlew validator:run --args='-c java/eks/service-events/incident-snapshot-validation.yml
          --testing-id ${{ env.TESTING_ID }}
          --endpoint http://${{ env.APP_ENDPOINT }}
          --region ${{ env.E2E_TEST_AWS_REGION }}
          --log-group /aws/service-events/${{ env.SERVICE_NAME }}
          --service-name ${{ env.SERVICE_NAME }}
          --rollup'

      - name: Validate IncidentSnapshot log (latency trigger)
        id: incident-snapshot-latency-validation
        if: (success() || steps.deployment-event-validation.outcome == 'failure' || steps.incident-snapshot-validation.outcome == 'failure') && !cancelled()
        run: ./gradlew validator:run --args='-c java/eks/service-events/incident-snapshot-latency-validation.yml
          --testing-id ${{ env.TESTING_ID }}
          --endpoint http://${{ env.APP_ENDPOINT }}
          --region ${{ env.E2E_TEST_AWS_REGION }}
          --log-group /aws/service-events/${{ env.SERVICE_NAME }}
          --service-name ${{ env.SERVICE_NAME }}
          --rollup'

      # ---- Service Events metric signals ----

      - name: Validate EndpointErrorMetric (count) via PromQL
        id: endpoint-error-metric-validation
        if: (success() || steps.deployment-event-validation.outcome == 'failure' || steps.incident-snapshot-validation.outcome == 'failure' || steps.incident-snapshot-latency-validation.outcome == 'failure') && !cancelled()
        run: ./gradlew validator:run --args='-c java/eks/service-events/endpoint-error-metric-validation.yml
          --testing-id ${{ env.TESTING_ID }}
          --endpoint http://${{ env.APP_ENDPOINT }}
          --region ${{ env.E2E_TEST_AWS_REGION }}
          --service-name ${{ env.SERVICE_NAME }}
          --rollup'

      - name: Validate FunctionCall (service.function.duration) via PromQL
        id: function-call-metric-validation
        if: (success() || steps.deployment-event-validation.outcome == 'failure' || steps.incident-snapshot-validation.outcome == 'failure' || steps.incident-snapshot-latency-validation.outcome == 'failure' || steps.endpoint-error-metric-validation.outcome == 'failure') && !cancelled()
        run: ./gradlew validator:run --args='-c java/eks/service-events/function-call-metric-validation.yml
          --testing-id ${{ env.TESTING_ID }}
          --endpoint http://${{ env.APP_ENDPOINT }}
          --region ${{ env.E2E_TEST_AWS_REGION }}
          --service-name ${{ env.SERVICE_NAME }}
          --rollup'

      - name: Save test results
        if: always()
        id: validation-result
        run: |
          if [ "${{ steps.deployment-event-validation.outcome }}" = "success" ] && \
             [ "${{ steps.incident-snapshot-validation.outcome }}" = "success" ] && \
             [ "${{ steps.incident-snapshot-latency-validation.outcome }}" = "success" ] && \
             [ "${{ steps.endpoint-error-metric-validation.outcome }}" = "success" ] && \
             [ "${{ steps.function-call-metric-validation.outcome }}" = "success" ]; then
            echo "validation-result=success" >> "$GITHUB_OUTPUT"
          else
            echo "validation-result=failure" >> "$GITHUB_OUTPUT"
          fi

      # ---- Clean up (only this run's namespace / resources; App Signals torn down by eks-cleanup) ----

      - name: Delete namespace
        if: always()
        continue-on-error: true
        run: kubectl delete namespace ${{ env.SAMPLE_APP_NAMESPACE }} --ignore-not-found --wait=false

      - name: Terraform destroy
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        working-directory: terraform/java/eks/service-events
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${{ env.E2E_TEST_AWS_REGION }}" \
            -var="main_node_port=30110" \
            -var="test_id=${{ env.TESTING_ID }}" \
            -var="eks_cluster_name=${{ env.CLUSTER_NAME }}" \
            -var="eks_cluster_context_name=$(kubectl config current-context)" \
            -var="test_namespace=${{ env.SAMPLE_APP_NAMESPACE }}" \
            -var="service_account_aws_access=service-account-${{ env.TESTING_ID }}" \
            -var="java_app_image=${{ env.MAIN_SAMPLE_APP_IMAGE_ARN }}" \
            -var="account_id=${{ env.ACCOUNT_ID }}" \
            -var="kube_directory_path=${{ github.workspace }}/.kube"

      - name: Remove aws access service account
        if: always()
        continue-on-error: true
        run: |
          eksctl delete iamserviceaccount \
          --name service-account-${{ env.TESTING_ID }} \
          --namespace ${{ env.SAMPLE_APP_NAMESPACE }} \
          --cluster ${{ env.CLUSTER_NAME }} \
          --region ${{ env.E2E_TEST_AWS_REGION }}
