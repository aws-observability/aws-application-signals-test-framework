# Full Python EKS e2e flow as ONE reusable workflow:
#   eks-setup  ->  [eks-py310..314 concurrently]  ->  eks-cleanup
#
# Why this exists: the caller (application-signals-e2e-test.yml) invokes this as a single job. From
# the caller's run, this whole workflow is one node in the graph, so "Re-run failed jobs" (or
# re-running the eks-e2e job) re-executes setup -> versions -> cleanup together AS A UNIT, including
# the shared-cluster setup that the version tests depend on -- WITHOUT re-running the rest of the
# e2e suite (ec2/ecs/lambda/etc.). It can also be launched standalone via workflow_dispatch.
name: Python EKS E2E (setup + parallel versions + cleanup)

on:
  workflow_call:
    inputs:
      adot-image-name:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: 'us-east-1'
      test-cluster-name:
        required: false
        type: string
        default: 'e2e-python-adot-test'
      caller-workflow-name:
        required: false
        type: string
        default: 'main-build'
  workflow_dispatch:
    inputs:
      adot-image-name:
        description: 'ADOT instrumentation image to inject and validate (required).'
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: 'us-east-1'
      test-cluster-name:
        required: false
        type: string
        default: 'e2e-python-adot-test'
      caller-workflow-name:
        required: false
        type: string
        default: 'main-build'

permissions:
  id-token: write
  contents: read

jobs:
  # Install the cluster-wide App Signals addon + cloudwatch-agent IRSA SA exactly once, before the
  # version fan-out. Gates every eks-py* job so none starts until shared state is ready.
  eks-setup:
    # TESTING PIN — revert '@python-eks-parallel-pipeline' back to '@main' before merge.
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/eks-setup-app-signals.yml@python-eks-parallel-pipeline
    secrets: inherit
    with:
      test-cluster-name: ${{ inputs.test-cluster-name }}
      aws-region: ${{ inputs.aws-region }}

  eks-py310-amd64:
    needs: eks-setup
    if: ${{ always() && needs.eks-setup.result == 'success' }}
    # TESTING PIN — revert '@python-eks-parallel-pipeline' back to '@main' before merge.
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-parallel-test.yml@python-eks-parallel-pipeline
    secrets: inherit
    with:
      aws-region: ${{ inputs.aws-region }}
      test-cluster-name: ${{ inputs.test-cluster-name }}
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: ${{ inputs.caller-workflow-name }}
      python-version: '3.10'

  eks-py311-amd64:
    needs: eks-setup
    if: ${{ always() && needs.eks-setup.result == 'success' }}
    # TESTING PIN — revert '@python-eks-parallel-pipeline' back to '@main' before merge.
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-parallel-test.yml@python-eks-parallel-pipeline
    secrets: inherit
    with:
      aws-region: ${{ inputs.aws-region }}
      test-cluster-name: ${{ inputs.test-cluster-name }}
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: ${{ inputs.caller-workflow-name }}
      python-version: '3.11'

  eks-py312-amd64:
    needs: eks-setup
    if: ${{ always() && needs.eks-setup.result == 'success' }}
    # TESTING PIN — revert '@python-eks-parallel-pipeline' back to '@main' before merge.
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-parallel-test.yml@python-eks-parallel-pipeline
    secrets: inherit
    with:
      aws-region: ${{ inputs.aws-region }}
      test-cluster-name: ${{ inputs.test-cluster-name }}
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: ${{ inputs.caller-workflow-name }}
      python-version: '3.12'

  eks-py313-amd64:
    needs: eks-setup
    if: ${{ always() && needs.eks-setup.result == 'success' }}
    # TESTING PIN — revert '@python-eks-parallel-pipeline' back to '@main' before merge.
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-parallel-test.yml@python-eks-parallel-pipeline
    secrets: inherit
    with:
      aws-region: ${{ inputs.aws-region }}
      test-cluster-name: ${{ inputs.test-cluster-name }}
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: ${{ inputs.caller-workflow-name }}
      python-version: '3.13'

  eks-py314-amd64:
    needs: eks-setup
    if: ${{ always() && needs.eks-setup.result == 'success' }}
    # TESTING PIN — revert '@python-eks-parallel-pipeline' back to '@main' before merge.
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/python-eks-parallel-test.yml@python-eks-parallel-pipeline
    secrets: inherit
    with:
      aws-region: ${{ inputs.aws-region }}
      test-cluster-name: ${{ inputs.test-cluster-name }}
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: ${{ inputs.caller-workflow-name }}
      python-version: '3.14'

  # Tear down cluster-wide App Signals state once, after ALL parallel eks-py* jobs finish.
  # if: always() so a failed version job still triggers teardown; gated on every eks-py* so it never
  # runs while a version job is still using the cluster.
  eks-cleanup:
    if: ${{ always() && needs.eks-setup.result == 'success' }}
    needs: [ eks-setup, eks-py310-amd64, eks-py311-amd64, eks-py312-amd64, eks-py313-amd64, eks-py314-amd64 ]
    # TESTING PIN — revert '@python-eks-parallel-pipeline' back to '@main' before merge.
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/eks-cleanup-app-signals.yml@python-eks-parallel-pipeline
    secrets: inherit
    with:
      test-cluster-name: ${{ inputs.test-cluster-name }}
      aws-region: ${{ inputs.aws-region }}
