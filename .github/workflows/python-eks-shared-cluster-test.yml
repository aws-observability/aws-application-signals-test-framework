name: Python EKS Use Case (Parallel/Shared cluster)
on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      test-cluster-name:
        required: true
        type: string
      caller-workflow-name:
        required: true
        type: string
      python-version:
        description: "Currently support version 3.10, 3.11, 3.12, 3.13, 3.14"
        required: false
        type: string
        default: '3.10'
      python-versions:
        description: "JSON array of all supported Python versions, ordered. This job's NodePort offset is python-version's index in this list. Managed here as the single source of truth."
        required: false
        type: string
        default: '["3.10","3.11","3.12","3.13","3.14"]'
      adot-image-name:
        required: false
        type: string
    outputs:
      job-started:
        value: ${{ jobs.python-eks.outputs.job-started }}
      validation-result:
        value: ${{ jobs.python-eks.outputs.validation-result }}

permissions:
  id-token: write
  contents: read

env:
  E2E_TEST_AWS_REGION: ${{ inputs.aws-region }}
  CLUSTER_NAME: ${{ inputs.test-cluster-name }}
  CALLER_WORKFLOW_NAME: ${{ inputs.caller-workflow-name }}
  PYTHON_VERSION: ${{ inputs.python-version }}
  PYTHON_VERSIONS: ${{ inputs.python-versions }}
  ADOT_IMAGE_NAME: ${{ inputs.adot-image-name }}
  E2E_TEST_ACCOUNT_ID: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}
  E2E_TEST_ROLE_NAME: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}
  METRIC_NAMESPACE: ApplicationSignals
  LOG_GROUP_NAME: /aws/application-signals/data
  TEST_RESOURCES_FOLDER: ${GITHUB_WORKSPACE}
  REPOSITORY_NAME: ${{ github.event.repository.name }}

jobs:
  python-eks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      job-started: ${{ steps.job-started.outputs.job-started }}
      validation-result: ${{ steps.validation-result.outputs.validation-result }}
    steps:
      - name: Check if the job started
        id: job-started
        run: echo "job-started=true" >> "$GITHUB_OUTPUT"

      - name: Generate testing id and python sample app namespace
        run: |
          # Sanitize the python version for a DNS-1123 namespace label (no dots).
          PY_VERSION_SLUG="py$(echo '${{ env.PYTHON_VERSION }}' | tr -d '.')"
          echo TESTING_ID="${{ github.job }}-${PY_VERSION_SLUG}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

          echo SAMPLE_APP_NAMESPACE="ns-${PY_VERSION_SLUG}-${{ github.run_id }}-${{ github.run_number }}" >> "$GITHUB_ENV"

          echo APP_SA_NAME="sa-${PY_VERSION_SLUG}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: 'aws-observability/aws-application-signals-test-framework'
          ref: ${{ inputs.caller-workflow-name == 'main-build' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Initiate Gradlew Daemon
        id: initiate-gradlew
        uses: ./.github/workflows/actions/execute_and_retry
        continue-on-error: true
        with:
          command: "./gradlew :validator:build"
          cleanup: "./gradlew clean"
          max_retry: 3
          sleep_time: 60

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.E2E_TEST_ACCOUNT_ID }}:role/${{ env.E2E_TEST_ROLE_NAME }}
          aws-region: us-east-1

      - name: Retrieve account
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            ACCOUNT_ID, region-account/${{ env.E2E_TEST_AWS_REGION }}
            PYTHON_MAIN_SAMPLE_APP_IMAGE, e2e-test/python-main-sample-app-image
            PYTHON_REMOTE_SAMPLE_APP_IMAGE, e2e-test/python-remote-sample-app-image


      # local directory to store the kubernetes config
      - name: Create kubeconfig directory
        run: mkdir -p ${{ github.workspace }}/.kube

      - name: Set KUBECONFIG environment variable
        run: echo KUBECONFIG="${{ github.workspace }}/.kube/config" >> "$GITHUB_ENV"

      - name: Set up kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.E2E_TEST_AWS_REGION }}

      - name: Download and install eksctl
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          pre-command: 'mkdir ${{ github.workspace }}/eksctl'
          command: 'curl -sLO "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" 
            && tar -xzf eksctl_Linux_amd64.tar.gz -C ${{ github.workspace }}/eksctl && rm eksctl_Linux_amd64.tar.gz'
          cleanup: 'rm -f eksctl_Linux_amd64.tar.gz'

      - name: Add eksctl to Github Path
        run: |
          echo "${{ github.workspace }}/eksctl" >> "$GITHUB_PATH"

      # Delete only THIS version's namespace from a prior run. Do NOT bulk-delete all ns-* namespaces
      - name: Delete this version's sample app namespace if it lingers
        continue-on-error: true
        timeout-minutes: 5
        run: kubectl delete namespace "${{ env.SAMPLE_APP_NAMESPACE }}" --ignore-not-found

      - name: Create role for AWS access from the sample app
        id: create_service_account
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: "eksctl create iamserviceaccount \
          --name ${{ env.APP_SA_NAME }} \
          --namespace ${{ env.SAMPLE_APP_NAMESPACE }} \
          --cluster ${{ env.CLUSTER_NAME }} \
          --role-name eks-s3-${{ env.APP_SA_NAME }} \
          --attach-policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess \
          --region ${{ env.E2E_TEST_AWS_REGION }} \
          --approve"
          cleanup: "eksctl delete iamserviceaccount \
          --name ${{ env.APP_SA_NAME }} \
          --namespace ${{ env.SAMPLE_APP_NAMESPACE }} \
          --cluster ${{ env.CLUSTER_NAME }} \
          --region ${{ env.E2E_TEST_AWS_REGION }}"
          sleep_time: 60

      - name: Set up terraform
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: "wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg"
          post-command: 'echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
              && sudo apt update && sudo apt install terraform'
          sleep_time: 60

      - name: Initiate Terraform
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: "cd ${{ env.TEST_RESOURCES_FOLDER }}/terraform/python/eks && terraform init && terraform validate"
          cleanup: "rm -rf .terraform && rm -rf .terraform.lock.hcl"
          max_retry: 6
          sleep_time: 60

      - name: Set Sample App Image
        run: |
            echo MAIN_SAMPLE_APP_IMAGE_ARN="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.E2E_TEST_AWS_REGION }}.amazonaws.com/${{ env.PYTHON_MAIN_SAMPLE_APP_IMAGE }}:v${{ env.PYTHON_VERSION }}" >> "$GITHUB_ENV"
            echo REMOTE_SAMPLE_APP_IMAGE_ARN="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.E2E_TEST_AWS_REGION }}.amazonaws.com/${{ env.PYTHON_REMOTE_SAMPLE_APP_IMAGE }}:v${{ env.PYTHON_VERSION }}" >> "$GITHUB_ENV"

      # The ADOT image this test injects. Set BEFORE deploy so the Instrumentation CR created in the
      # deploy step can reference it.
      - name: Determine ADOT image to inject
        run: |
          if [ -z "${{ env.ADOT_IMAGE_NAME }}" ]; then
            echo "::error::adot-image-name input is empty; nothing to inject."
            exit 1
          fi
          echo PATCH_IMAGE_ARN="${{ env.ADOT_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Deploy sample app via terraform and wait for the endpoint to come online
        id: deploy-python-app
        working-directory: terraform/python/eks
        run: |
          # Attempt to deploy the sample app on an EKS instance and wait for its endpoint to come online. 
          # There may be occasional failures due to transitivity issues, so try up to 2 times. 
          # deployment_failed of 0 indicates that both the terraform deployment and the endpoint are running, while 1 indicates
          # that it failed at some point
          retry_counter=0
          max_retry=2
          while [ $retry_counter -lt $max_retry ]; do
            echo "Attempt $retry_counter"
            deployment_failed=0
            terraform apply -auto-approve \
              -var='python_version=${{ env.PYTHON_VERSION }}' \
              -var='python_versions=${{ env.PYTHON_VERSIONS }}' \
              -var='test_id=${{ env.TESTING_ID }}' \
              -var='aws_region=${{ env.E2E_TEST_AWS_REGION }}' \
              -var='kube_directory_path=${{ github.workspace }}/.kube' \
              -var='eks_cluster_name=${{ env.CLUSTER_NAME }}' \
              -var="eks_cluster_context_name=$(kubectl config current-context)" \
              -var='test_namespace=${{ env.SAMPLE_APP_NAMESPACE }}' \
              -var='service_account_aws_access=${{ env.APP_SA_NAME }}' \
              -var='python_app_image=${{ env.MAIN_SAMPLE_APP_IMAGE_ARN }}' \
              -var='python_remote_app_image=${{ env.REMOTE_SAMPLE_APP_IMAGE_ARN }}' \
              -var='account_id=${{ env.ACCOUNT_ID }}' \
            || deployment_failed=$?
          
            if [ $deployment_failed -eq 1 ]; then
              echo "Terraform deployment was unsuccessful. Will attempt to retry deployment."
            fi

            # If the deployment_failed is still 0, then the terraform deployment succeeded and now try to connect to the endpoint 
            # after installing Application Signals. Attempts to connect will be made for up to 10 minutes
            if [ $deployment_failed -eq 0 ]; then
              echo "Verifying Application Signals is enabled on the cluster"
              . ${{ env.TEST_RESOURCES_FOLDER }}/.github/workflows/util/execute_and_retry.sh

              aws eks update-kubeconfig --region ${{ env.E2E_TEST_AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

              execute_and_retry 30 \
                "[ \"\$(aws eks describe-addon --cluster-name ${{ env.CLUSTER_NAME }} --addon-name amazon-cloudwatch-observability --region ${{ env.E2E_TEST_AWS_REGION }} --query 'addon.status' --output text)\" = ACTIVE ]" \
                "" 20

              agent_pods=$(kubectl get pods -n amazon-cloudwatch -l app.kubernetes.io/name=cloudwatch-agent \
                -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.spec.containers[0].env[?(@.name=="AWS_ROLE_ARN")].value}{"\n"}{end}' 2>/dev/null) || {
                  echo "::error::Could not query cloudwatch-agent pods in amazon-cloudwatch namespace."
                  exit 1
                }
              agent_pods=$(printf '%s\n' "$agent_pods" | grep -v '^[[:space:]]*$' || true)
              agent_total=$(printf '%s\n' "$agent_pods" | grep -c . || true)
              if [ "${agent_total:-0}" -eq 0 ]; then
                echo "::error::No cloudwatch-agent pods found. The CloudWatch agent is not running, so no"
                echo "telemetry can reach CloudWatch. Shared setup (eks-setup-app-signals.yml) should have"
                echo "installed the amazon-cloudwatch-observability addon before this job ran."
                exit 1
              fi
              agent_missing_irsa=$(printf '%s\n' "$agent_pods" | awk -F'|' '$2==""{print $1}')
              if [ -n "$agent_missing_irsa" ]; then
                echo "::error::cloudwatch-agent pods lack projected IRSA credentials: $agent_missing_irsa"
                echo "The agent will authenticate as the EC2 node role and get AccessDeniedException on"
                echo "logs:PutLogEvents, so no telemetry will reach CloudWatch and validation will fail."
                echo "Shared setup (eks-setup-app-signals.yml) should have established this."
                exit 1
              fi
              echo "cloudwatch-agent has IRSA credentials projected ($agent_total pod(s))."
 
              patched=0
              for patch_attempt in 1 2 3 4 5 6; do
                CURRENT_PY_IMAGE=$(kubectl get deploy -n amazon-cloudwatch amazon-cloudwatch-observability-controller-manager \
                  -o jsonpath='{range .spec.template.spec.containers[0].args[*]}{.}{"\n"}{end}' \
                  | sed -n 's/^--auto-instrumentation-python-image=//p')
                if [ "$CURRENT_PY_IMAGE" = "${{ env.PATCH_IMAGE_ARN }}" ]; then
                  echo "Operator python image is set to target (${{ env.PATCH_IMAGE_ARN }})."
                  patched=1
                  break
                fi
                echo "Attempt $patch_attempt: patching operator python image '$CURRENT_PY_IMAGE' -> '${{ env.PATCH_IMAGE_ARN }}'"
                if kubectl get deploy -n amazon-cloudwatch amazon-cloudwatch-observability-controller-manager -o json \
                    | jq '.spec.template.spec.containers[0].args |= map(if test("^--auto-instrumentation-python-image=") then "--auto-instrumentation-python-image=${{ env.PATCH_IMAGE_ARN }}" else . end)' \
                    | kubectl apply -f - ; then
                  echo "Patch applied on attempt $patch_attempt."
                  patched=1
                  break
                fi
                echo "Patch attempt $patch_attempt lost a concurrent write; re-reading and retrying..."
                sleep 10
              done
              if [ "$patched" -ne 1 ]; then
                echo "Failed to set operator python image after retries."
                exit 1
              fi

              kubectl -n amazon-cloudwatch rollout status \
                deployment/amazon-cloudwatch-observability-controller-manager --timeout=180s \
                || echo "Operator rollout wait timed out; continuing (injection is verified below)."

              inject_verified=0
              for inject_attempt in 1 2 3 4 5; do
                execute_and_retry 2 "kubectl delete pods --all -n ${{ env.SAMPLE_APP_NAMESPACE }}" "" 60
                execute_and_retry 2 "kubectl wait --for=condition=Ready --request-timeout '5m' pod --all -n ${{ env.SAMPLE_APP_NAMESPACE }}" "" 10
                INJECTED_IMAGE=$(kubectl get pod -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=python-app \
                  -o jsonpath='{.items[0].spec.initContainers[?(@.name=="opentelemetry-auto-instrumentation-python")].image}' 2>/dev/null || true)
                if [ "$INJECTED_IMAGE" = "${{ env.PATCH_IMAGE_ARN }}" ]; then
                  echo "Instrumentation injected with target image on attempt $inject_attempt: $INJECTED_IMAGE"
                  inject_verified=1
                  break
                fi
                echo "Instrumentation not yet injected with target image on attempt $inject_attempt (got: '${INJECTED_IMAGE:-none}', want: '${{ env.PATCH_IMAGE_ARN }}'); retrying restart..."
                sleep 20
              done
              if [ "$inject_verified" -ne 1 ]; then
                echo "Instrumentation was never injected with the target image after retries; failing so this is not a silent empty-telemetry pass."
                exit 1
              fi
            fi
          
            # If the deployment_failed is 1 then either the terraform deployment or the endpoint connection failed, so first destroy the
            # resources created from terraform and try again.
            if [ $deployment_failed -eq 1 ]; then
              echo "Destroying terraform"
              terraform destroy -auto-approve \
                -var='python_version=${{ env.PYTHON_VERSION }}' \
                -var='python_versions=${{ env.PYTHON_VERSIONS }}' \
                -var='test_id=${{ env.TESTING_ID }}' \
                -var='aws_region=${{ env.E2E_TEST_AWS_REGION }}' \
                -var='kube_directory_path=${{ github.workspace }}/.kube' \
                -var='eks_cluster_name=${{ env.CLUSTER_NAME }}' \
                -var="eks_cluster_context_name=$(kubectl config current-context)" \
                -var='test_namespace=${{ env.SAMPLE_APP_NAMESPACE }}' \
                -var='service_account_aws_access=${{ env.APP_SA_NAME }}' \
                -var='python_app_image=${{ env.MAIN_SAMPLE_APP_IMAGE_ARN }}' \
                -var='python_remote_app_image=${{ env.REMOTE_SAMPLE_APP_IMAGE_ARN }}'
          
              retry_counter=$(($retry_counter+1))
            else
              # If deployment succeeded, then exit the loop
              break
            fi
          
            if [ $retry_counter -ge $max_retry ]; then
              echo "Max retry reached, failed to deploy terraform and connect to the endpoint. Exiting code"
              exit 1
            fi
          done


      - name: Get Remote Service Deployment Name
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: echo "REMOTE_SERVICE_DEPLOYMENT_NAME=$(kubectl get deployments -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=remote-app -o jsonpath='{.items[0].metadata.name}')" >> "$GITHUB_ENV"
          max_retry: 3
          sleep_time: 30

      - name: Get Remote Service IP
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: echo "REMOTE_SERVICE_POD_IP=$(kubectl get pods -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=remote-app -o jsonpath='{.items[0].status.podIP}')" >> "$GITHUB_ENV"
          max_retry: 3
          sleep_time: 30

      - name:  Get the sample app endpoint
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: echo "APP_ENDPOINT=$(kubectl get pods -n ${{ env.SAMPLE_APP_NAMESPACE }} --selector=app=python-app -o jsonpath='{.items[0].status.podIP}'):8000" >> "$GITHUB_ENV"
          max_retry: 3
          sleep_time: 30

      - name: Set endpoints for the traffic generator
        uses: ./.github/workflows/actions/execute_and_retry
        with:
          command: kubectl set env -n ${{ env.SAMPLE_APP_NAMESPACE }} deployment/traffic-generator MAIN_ENDPOINT=${{ env.APP_ENDPOINT }} REMOTE_ENDPOINT=${{ env.REMOTE_SERVICE_POD_IP }}
          max_retry: 3
          sleep_time: 30

      - name: Initiate Gradlew Daemon
        if: steps.initiate-gradlew.outcome == 'failure'
        uses: ./.github/workflows/actions/execute_and_retry
        continue-on-error: true
        with:
          command: "./gradlew :validator:build"
          cleanup: "./gradlew clean"
          max_retry: 3
          sleep_time: 60

      # Validation for application signals telemetry data
      - name: Call endpoint and validate generated EMF logs
        id: log-validation
        if: steps.deploy-python-app.outcome == 'success' && !cancelled()
        run: ./gradlew validator:run --args='-c python/eks/log-validation.yml
          --testing-id ${{ env.TESTING_ID }}
          --endpoint http://${{ env.APP_ENDPOINT }}
          --region ${{ env.E2E_TEST_AWS_REGION }}
          --account-id ${{ env.ACCOUNT_ID }}
          --metric-namespace ${{ env.METRIC_NAMESPACE }}
          --log-group ${{ env.LOG_GROUP_NAME }}
          --app-namespace ${{ env.SAMPLE_APP_NAMESPACE }}
          --platform-info ${{ env.CLUSTER_NAME }}
          --service-name python-application-${{ env.TESTING_ID }}
          --remote-service-deployment-name ${{ env.REMOTE_SERVICE_DEPLOYMENT_NAME }}
          --remote-resource-identifier "information_schema|mysql-service.${{ env.SAMPLE_APP_NAMESPACE }}.svc.cluster.local|3306"
          --remote-db-user root
          --query-string ip=${{ env.REMOTE_SERVICE_POD_IP }}&testingId=${{ env.TESTING_ID }}
          --rollup'

      - name: Call endpoints and validate generated metrics
        id: metric-validation
        if: (steps.deploy-python-app.outcome == 'success' || steps.log-validation.outcome == 'failure') && !cancelled()
        run: ./gradlew validator:run --args='-c python/eks/metric-validation.yml
          --testing-id ${{ env.TESTING_ID }}
          --endpoint http://${{ env.APP_ENDPOINT }}
          --region ${{ env.E2E_TEST_AWS_REGION }}
          --account-id ${{ env.ACCOUNT_ID }}
          --metric-namespace ${{ env.METRIC_NAMESPACE }}
          --log-group ${{ env.LOG_GROUP_NAME }}
          --app-namespace ${{ env.SAMPLE_APP_NAMESPACE }}
          --platform-info ${{ env.CLUSTER_NAME }}
          --service-name python-application-${{ env.TESTING_ID }}
          --remote-service-name python-remote-application-${{ env.TESTING_ID }}
          --remote-service-deployment-name ${{ env.REMOTE_SERVICE_DEPLOYMENT_NAME }}
          --remote-resource-identifier "information_schema|mysql-service.${{ env.SAMPLE_APP_NAMESPACE }}.svc.cluster.local|3306"
          --query-string ip=${{ env.REMOTE_SERVICE_POD_IP }}&testingId=${{ env.TESTING_ID }}
          --rollup'

      - name: Call endpoints and validate generated traces
        id: trace-validation
        if: (steps.deploy-python-app.outcome == 'success' || steps.log-validation.outcome == 'failure' || steps.metric-validation.outcome == 'failure') && !cancelled()
        run: ./gradlew validator:run --args='-c python/eks/trace-validation.yml
          --testing-id ${{ env.TESTING_ID }}
          --endpoint http://${{ env.APP_ENDPOINT }}
          --region ${{ env.E2E_TEST_AWS_REGION }}
          --account-id ${{ env.ACCOUNT_ID }}
          --log-group ${{ env.LOG_GROUP_NAME }}
          --app-namespace ${{ env.SAMPLE_APP_NAMESPACE }}
          --platform-info ${{ env.CLUSTER_NAME }}
          --service-name python-application-${{ env.TESTING_ID }}
          --remote-service-deployment-name ${{ env.REMOTE_SERVICE_DEPLOYMENT_NAME }}
          --remote-resource-identifier "information_schema|mysql-service.${{ env.SAMPLE_APP_NAMESPACE }}.svc.cluster.local|3306"
          --query-string ip=${{ env.REMOTE_SERVICE_POD_IP }}&testingId=${{ env.TESTING_ID }}
          --rollup'

      - name: Save test results
        if: always()
        id: validation-result
        run: |
          if [ "${{ steps.log-validation.outcome }}" = "success" ] && [ "${{ steps.metric-validation.outcome }}" = "success" ] && [ "${{ steps.trace-validation.outcome }}" = "success" ]; then
            echo "validation-result=success" >> "$GITHUB_OUTPUT"
          else
            echo "validation-result=failure" >> "$GITHUB_OUTPUT"
          fi

      # Clean up Procedures
      - name: Delete this version's sample app namespace
        if: always()
        continue-on-error: true
        run: kubectl delete namespace ${{ env.SAMPLE_APP_NAMESPACE }} --ignore-not-found

      - name: Terraform destroy
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        working-directory: terraform/python/eks
        run: |
          terraform destroy -auto-approve \
            -var='python_version=${{ env.PYTHON_VERSION }}' \
            -var='python_versions=${{ env.PYTHON_VERSIONS }}' \
            -var='test_id=${{ env.TESTING_ID }}' \
            -var='aws_region=${{ env.E2E_TEST_AWS_REGION }}' \
            -var='kube_directory_path=${{ github.workspace }}/.kube' \
            -var='eks_cluster_name=${{ env.CLUSTER_NAME }}' \
            -var='test_namespace=${{ env.SAMPLE_APP_NAMESPACE }}' \
            -var='service_account_aws_access=${{ env.APP_SA_NAME }}' \
            -var='python_app_image=${{ env.MAIN_SAMPLE_APP_IMAGE_ARN }}' \
            -var='python_remote_app_image=${{ env.REMOTE_SAMPLE_APP_IMAGE_ARN }}'

      - name: Remove aws access service account
        if: always()
        continue-on-error: true
        run: |
          eksctl delete iamserviceaccount \
          --name ${{ env.APP_SA_NAME }} \
          --namespace ${{ env.SAMPLE_APP_NAMESPACE }} \
          --cluster ${{ env.CLUSTER_NAME }} \
          --region ${{ env.E2E_TEST_AWS_REGION }}

     
      # On failure, tell the operator to re-run the whole pipeline starting from setup.
      - name: How to re-run this test
        if: failure()
        run: |
          echo "=================================================================="
          echo "  This test job cannot be re-run on its own."
          echo ""
          echo "  => Re-run the pipeline starting from eks-setup so it flows:"
          echo "       eks-setup -> eks-py3xx (this test) -> eks-cleanup"
          echo ""
          echo "  It needs shared cluster state (App Signals addon + agent IRSA)"
          echo "  that eks-setup installs and eks-cleanup tears down. Re-running"
          echo "  ONLY this job skips setup, so it runs against a torn-down"
          echo "  cluster and fails again."
          echo "=================================================================="
