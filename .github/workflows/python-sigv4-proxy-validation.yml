name: Python SigV4 forwarding proxy validation
on:
  workflow_dispatch:
    inputs:
      adot-ref:
        description: "Python ADOT commit or ref to build (for example, refs/pull/928/head)."
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      adot-ref:
        required: false
        default: main
        type: string
      caller-workflow-name:
        required: false
        default: test
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-adot:
    runs-on: ubuntu-latest
    outputs:
      wheel-name: ${{ steps.wheel.outputs.name }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: aws-observability/aws-otel-python-instrumentation
          ref: ${{ inputs.adot-ref }}

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Build Python ADOT wheel
        uses: ./.github/actions/artifacts_build/build_wheel

      - name: Give the test wheel a unique build tag
        id: wheel
        run: |
          wheels=(dist/aws_opentelemetry_distro-*-py3-none-any.whl)
          test "${#wheels[@]}" -eq 1
          wheel=$(basename "${wheels[0]}")
          test_wheel="${wheel%-py3-none-any.whl}-0${GITHUB_RUN_ID}-py3-none-any.whl"
          mv "dist/$wheel" "dist/$test_wheel"
          echo "name=$test_wheel" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}:role/${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}
          aws-region: us-east-1

      - name: Upload the test wheel to staging
        env:
          WHEEL_NAME: ${{ steps.wheel.outputs.name }}
        run: aws s3 cp "dist/$WHEEL_NAME" "s3://adot-main-build-staging-jar/$WHEEL_NAME"

  python-ec2-adot-sigv4-proxy:
    needs: build-adot
    uses: ./.github/workflows/python-ec2-adot-sigv4-test.yml
    secrets: inherit
    with:
      caller-workflow-name: ${{ inputs.caller-workflow-name || 'test' }}
      python-version: '3.11'
      staging-wheel-name: ${{ needs.build-adot.outputs.wheel-name }}
      use-otlp-proxy: true
