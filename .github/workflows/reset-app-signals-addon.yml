# Standalone, manually-triggered reset of the Application Signals addon on a shared EKS test cluster.
#
# WHY THIS IS SEPARATE FROM THE TEST WORKFLOWS:
# clean-app-signals.sh runs `eksctl delete iamserviceaccount cloudwatch-agent`, which removes the
# CloudWatch agent's IRSA service account. On a shared cluster this is destructive: the parallel EKS
# test jobs depend on that agent to export telemetry, and deleting/recreating the SA opens a race
# where agent pods can start before the SA annotation exists -> they fall back to the node role ->
# logs:PutLogEvents / xray:PutTraceSegments AccessDenied -> ALL App Signals telemetry dropped
# cluster-wide. For that reason the per-run test workflows never call clean-app-signals.sh.
#
# This workflow is the deliberate "reset button": run it manually (workflow_dispatch) when NO tests
# are running, to fully tear down and reinstall App Signals (e.g. addon upgrade, or to repair a
# broken state). It clean -> enable -> RESTARTS the cloudwatch-agent so pods pick up the freshly
# created IRSA SA -> verifies IRSA is present, closing the race that makes clean+enable unsafe.
name: Reset Application Signals Addon

on:
  workflow_dispatch:
    inputs:
      test-cluster-name:
        description: 'EKS cluster to reset (e.g. e2e-python-adot-test)'
        required: true
        type: string
      aws-region:
        description: 'Region of the cluster'
        required: false
        type: string
        default: 'us-east-1'

permissions:
  id-token: write
  contents: read

env:
  CLUSTER_NAME: ${{ inputs.test-cluster-name }}
  E2E_TEST_AWS_REGION: ${{ inputs.aws-region }}
  E2E_TEST_ACCOUNT_ID: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}
  E2E_TEST_ROLE_NAME: ${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}

jobs:
  reset-app-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.E2E_TEST_ACCOUNT_ID }}:role/${{ env.E2E_TEST_ROLE_NAME }}
          aws-region: ${{ env.E2E_TEST_AWS_REGION }}

      - name: Download enablement scripts
        run: |
          mkdir -p enablement-script && cd enablement-script
          wget -q https://raw.githubusercontent.com/aws-observability/application-signals-demo/main/scripts/eks/appsignals/enable-app-signals.sh
          wget -q https://raw.githubusercontent.com/aws-observability/application-signals-demo/main/scripts/eks/appsignals/clean-app-signals.sh
          chmod +x enable-app-signals.sh clean-app-signals.sh

      - name: Set up kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.E2E_TEST_AWS_REGION }}

      # Safety guard: refuse to reset if sample-app test namespaces are currently present, since a
      # reset here would break an in-progress test run (the exact hazard this workflow exists to avoid).
      - name: Refuse to reset while tests are running
        run: |
          active=$(kubectl get namespace -o name 2>/dev/null | grep -E 'namespace/ns-' || true)
          if [ -n "$active" ]; then
            echo "Refusing to reset: active test namespaces present:"
            echo "$active"
            echo "Wait for runs to finish (or delete stale ns-* first), then re-run this workflow."
            exit 1
          fi
          echo "No active test namespaces; safe to reset."

      - name: Clean up Application Signals (delete addon + agent IRSA)
        working-directory: enablement-script
        run: |
          ./clean-app-signals.sh \
            ${{ env.CLUSTER_NAME }} \
            ${{ env.E2E_TEST_AWS_REGION }} \
            default
          # clean-app-signals.sh removes the current cluster from kubeconfig; re-add it.
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.E2E_TEST_AWS_REGION }}

      - name: Reinstall Application Signals (recreate addon + agent IRSA)
        working-directory: enablement-script
        run: |
          ./enable-app-signals.sh \
            ${{ env.CLUSTER_NAME }} \
            ${{ env.E2E_TEST_AWS_REGION }} \
            default
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.E2E_TEST_AWS_REGION }}

      # enable-app-signals.sh recreates the cloudwatch-agent service account, but the agent pods may
      # already be running from the reinstall and would then be missing the IRSA env (creds are only
      # injected at pod-admission time). Restart the DaemonSet so every agent pod re-reads the SA.
      - name: Restart cloudwatch-agent so it picks up IRSA
        run: |
          kubectl -n amazon-cloudwatch rollout restart daemonset/cloudwatch-agent
          kubectl -n amazon-cloudwatch rollout status daemonset/cloudwatch-agent --timeout=180s

      - name: Verify agent has IRSA (fail loudly if not)
        run: |
          irsa=$(kubectl get pod -n amazon-cloudwatch --selector=app.kubernetes.io/name=cloudwatch-agent \
            -o jsonpath='{.items[0].spec.containers[0].env[?(@.name=="AWS_ROLE_ARN")].value}' 2>/dev/null || true)
          if [ -z "$irsa" ]; then
            echo "cloudwatch-agent is MISSING IRSA (AWS_ROLE_ARN) after reset — agent would run on the"
            echo "node role and drop telemetry. Reset did not fully succeed."
            exit 1
          fi
          echo "cloudwatch-agent IRSA restored: $irsa"
