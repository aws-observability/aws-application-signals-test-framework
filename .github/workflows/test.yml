## Scratch dispatch caller for Java EC2 profiler E2E version-matrix validation (PR #709).
## DO NOT MERGE — scratch branch only.
name: Test
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  java-ec2-profiler:
    strategy:
      fail-fast: false
      matrix:
        java-version: ['8', '11', '17', '21', '25']
    uses: ./.github/workflows/java-ec2-profiler-test.yml
    secrets: inherit
    with:
      aws-region: 'us-east-1'
      caller-workflow-name: 'test'
      java-version: ${{ matrix.java-version }}
