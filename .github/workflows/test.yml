## Temporary dispatch caller for validating the .NET EKS Service Events endpoint fix.
## DO NOT MERGE — this branch exists only to run the E2E test before merging the fix PR.
name: Test
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dotnet-eks-service-events:
    uses: ./.github/workflows/dotnet-eks-service-events-test.yml
    secrets: inherit
    with:
      runs-on: '["codebuild-adot-test-framework-runner-${{ github.run_id }}-${{ github.run_attempt }}", "image:ubuntu-8.0", "instance-size:large"]'
      aws-region: 'us-east-1'
      test-cluster-name: 'e2e-dotnet-adot-test'
      caller-workflow-name: 'test'
      # Same ADOT staging image as the failing main-build run 44213387910, so the only change under
      # test is the endpoint configuration.
      adot-image-name: '637423224110.dkr.ecr.us-east-1.amazonaws.com/aws-observability/adot-autoinstrumentation-dotnet-staging:staging-linux-amd64-f41a6f1'
