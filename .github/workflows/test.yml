# Temporary test workflow for the .NET custom metrics E2E test. Remove before merge.
name: Test
on:
  push:
    branches:
      - DOTNET_Custom_metrics

permissions:
  id-token: write
  contents: read

jobs:
  dotnet-ec2-default-test:
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0', '9.0', '10.0']
    uses: ./.github/workflows/dotnet-ec2-default-test.yml
    secrets: inherit
    with:
      caller-workflow-name: 'test'
      aws-region: 'us-east-1'
      dotnet-version: ${{ matrix.dotnet-version }}

  dotnet-ec2-asg-test:
    uses: ./.github/workflows/dotnet-ec2-asg-test.yml
    secrets: inherit
    with:
      caller-workflow-name: 'test'
      aws-region: 'us-east-1'

  dotnet-ec2-adot-sigv4-test:
    uses: ./.github/workflows/dotnet-ec2-adot-sigv4-test.yml
    secrets: inherit
    with:
      caller-workflow-name: 'test'

  dotnet-ec2-nuget-test:
    uses: ./.github/workflows/dotnet-ec2-nuget-test.yml
    secrets: inherit
    with:
      caller-workflow-name: 'test'
      aws-region: 'us-east-1'

  dotnet-ec2-service-events-test:
    uses: ./.github/workflows/dotnet-ec2-service-events-test.yml
    secrets: inherit
    with:
      caller-workflow-name: 'test'
      aws-region: 'us-east-1'
      sample-app-zip: 's3://aws-appsignals-sample-app-prod-us-east-1/dotnet-sample-app-8.0-delete-me.zip'

  dotnet-ec2-windows-test:
    uses: ./.github/workflows/dotnet-ec2-windows-test.yml
    secrets: inherit
    with:
      caller-workflow-name: 'test'
      aws-region: 'us-east-1'

  dotnet-eks-test:
    uses: ./.github/workflows/dotnet-eks-test.yml
    secrets: inherit
    with:
      caller-workflow-name: 'test'
      aws-region: 'us-east-1'
      test-cluster-name: 'e2e-dotnet-adot-test'

  # Shares the e2e-dotnet-adot-test cluster with dotnet-eks-test, so it must not run concurrently.
  dotnet-eks-service-events-test:
    needs: dotnet-eks-test
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/dotnet-eks-service-events-test.yml
    secrets: inherit
    with:
      caller-workflow-name: 'test'
      aws-region: 'us-east-1'
      test-cluster-name: 'e2e-dotnet-adot-test'

  dotnet-k8s-test:
    uses: ./.github/workflows/dotnet-k8s-test.yml
    secrets: inherit
    with:
      caller-workflow-name: 'test'
      aws-region: 'us-east-1'
